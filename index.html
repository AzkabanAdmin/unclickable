<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Definitely Optional Newsletter</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 40px 20px; }
    .form-card { width: min(580px, 100%); margin: auto; padding: 26px; border: 1px solid #334155; border-radius: 16px; background: #1e293b; box-shadow: 0 24px 70px #02061780; }
    h1 { margin: 0 0 8px; }
    .intro, .hint { color: #94a3b8; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 28px; }
    .field { display: grid; gap: 7px; }
    .field.full { grid-column: 1 / -1; }
    label, legend { font-weight: 650; }
    input[type="text"], input[type="email"], select { width: 100%; padding: 12px 13px; border: 1px solid #475569; border-radius: 10px; background: #0f172a; color: #f8fafc; font: inherit; }
    input:focus, select:focus { outline: 3px solid #38bdf840; border-color: #38bdf8; }
    fieldset { min-width: 0; }
    #newsletter-arena { grid-column: 1 / -1; padding: 10px 12px 12px; border: 1px solid #475569; border-radius: 12px; background: #172033; }
    #newsletter-arena legend { padding: 0 8px; }
    #newsletter-options { display: flex; align-items: flex-start; gap: 10px; min-height: 76px; padding: 8px 2px; overflow: hidden; }
    .choice { display: inline-flex; align-items: center; gap: 8px; padding: 9px 12px; border: 2px solid #475569; border-radius: 10px; background: #263449; cursor: pointer; white-space: nowrap; }
    .choice input { width: 20px; height: 20px; margin: 0; accent-color: #22c55e; }
    .yes-choice { border-color: #22c55e; }
    .no-choice { border-color: #fb7185; background: #4c1d2c; }
    .terms { display: flex; align-items: flex-start; gap: 10px; color: #cbd5e1; font-weight: 500; }
    .terms input { width: 18px; height: 18px; margin-top: 2px; }
    .actions { display: flex; align-items: center; gap: 16px; grid-column: 1 / -1; }
    .attempt-counter { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px dashed #64748b; border-radius: 10px; color: #cbd5e1; }
    #attempt-count { display: inline-grid; place-items: center; min-width: 32px; height: 32px; padding: 0 8px; border-radius: 999px; background: #f43f5e; color: white; font-weight: 900; }
    button[type="submit"] { padding: 13px 22px; border: 0; border-radius: 10px; background: #38bdf8; color: #082f49; font: inherit; font-weight: 800; cursor: pointer; }
    button[type="submit"]:hover { background: #7dd3fc; }
    #status { min-height: 24px; margin: 0; color: #a7f3d0; }
    @media (max-width: 580px) { .form-grid { grid-template-columns: 1fr; } .form-card { padding: 22px; } }
  </style>
</head>
<body>
  <main class="form-card">
    <h1>Create your account</h1>
    <p class="intro">Complete the form below. Every field works—although one answer is suspiciously difficult to choose.</p>

    <form id="signup-form">
      <div class="form-grid">
        <div class="field">
          <label for="first-name">First name</label>
          <input id="first-name" name="firstName" type="text" autocomplete="given-name" required>
        </div>

        <div class="field">
          <label for="last-name">Last name</label>
          <input id="last-name" name="lastName" type="text" autocomplete="family-name" required>
        </div>

        <div class="field full">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>

        <div class="field full">
          <label for="plan">Plan</label>
          <select id="plan" name="plan" required>
            <option value="">Choose a plan</option>
            <option value="starter">Starter</option>
            <option value="professional">Professional</option>
            <option value="enterprise">Enterprise</option>
          </select>
        </div>

        <fieldset id="newsletter-arena">
          <legend>Would you like helpful product updates?</legend>
          <div id="newsletter-options">
          <label class="choice yes-choice">
            <input id="newsletter-yes" name="newsletter" type="radio" value="yes" required>
            <span>Yes, keep me informed</span>
          </label>

          <label id="newsletter-no-option" class="choice no-choice" data-unclickable>
            <input id="newsletter-no" name="newsletter" type="radio" value="no" required>
            <span>No, not right now</span>
          </label>
          </div>
        </fieldset>

        <div class="attempt-counter">
          No click attempts caught:
          <output id="attempt-count">0</output>
        </div>

        <label class="terms field full">
          <input name="terms" type="checkbox" required>
          <span>I agree to the entirely reasonable terms and conditions.</span>
        </label>

        <div class="actions">
          <button type="submit">Create account</button>
          <p id="status" role="status"></p>
        </div>
      </div>
    </form>
  </main>

  <script type="module">
    import { makeUnclickable } from "./unclickable.js";

    const status = document.querySelector("#status");
    const attemptCount = document.querySelector("#attempt-count");
    let attempts = 0;

    makeUnclickable("#newsletter-no-option", {
      container: document.querySelector("#newsletter-options"),
      mode: ["fade"],
      duration: 440,
      dangerRadius: 85,
      collisionPadding: 12,
      minimumTravel: 30,
      preserveLayout: true,
      onAttempt: () => {
        attempts += 1;
        attemptCount.value = String(attempts);
      },
      onMode: () => {
        status.textContent = "The No option escaped. Perhaps try Yes?";
      },
    });

    document.querySelector("#signup-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const data = new FormData(event.currentTarget);
      status.textContent = `Account ready for ${data.get("firstName")} on the ${data.get("plan")} plan. Newsletter: ${data.get("newsletter")}.`;
    });
  </script>
</body>
</html>
